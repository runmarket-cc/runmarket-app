name: EAS Build & Deploy

# GitHub Actions 탭에서 버튼 클릭(수동 trigger) 시
# Expo EAS Build를 사용하여 iOS/Android 앱을 빌드하고 스토어로 자동 배포(Submit)합니다.

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: '배포할 앱 버전 (예: 1.1.10, 비워두면 기존 릴리스 태그와 실행 번호로 자동 생성)'
        required: false
        default: ''
        type: string
      platform:
        description: '빌드 및 배포 대상 플랫폼 (all, ios, android)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: 'EAS 빌드 프로필 (eas.json의 production, preview 등)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development
      auto_submit:
        description: '빌드 완료 후 스토어(App Store / Google Play)로 자동 배포(Submit) 진행'
        required: true
        default: true
        type: boolean

concurrency:
  group: eas-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  build-and-deploy:
    name: Build & Deploy (${{ inputs.platform }} - ${{ inputs.profile }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version handling
        run: node tests/release-version.test.cjs

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine and Apply App Version
        id: version
        env:
          REQUESTED_APP_VERSION: ${{ inputs.app_version }}
          BUILD_PROFILE: ${{ inputs.profile }}
          BUILD_PLATFORM: ${{ inputs.platform }}
          AUTO_SUBMIT: ${{ inputs.auto_submit }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            echo "::error::Re-running keeps the same app version. Start a new workflow run instead."
            exit 1
          fi
          if [ "$BUILD_PROFILE" = production ] && [ "$BUILD_PLATFORM" != android ] && [ "$AUTO_SUBMIT" = true ]; then
            export GUARD_IOS_SUBMISSION=true
          fi
          FINAL_VERSION="$(node scripts/select-release-version.cjs)"
          echo "Final app version: $FINAL_VERSION"
          echo "version=$FINAL_VERSION" >> "$GITHUB_OUTPUT"
          npm version "$FINAL_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          # Persist the version in the uploaded profile so remote prebuild sees it too.
          APP_VERSION="$FINAL_VERSION" node scripts/prepare-eas-version.cjs

      - name: Run EAS Build & Auto-Submit
        run: |
          SUBMIT_OPT=""
          if [ "${{ inputs.auto_submit }}" = "true" ]; then
            SUBMIT_OPT="--auto-submit"
          fi
          
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            $SUBMIT_OPT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Create and Push Git Tag
        if: success()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG_NAME="v${VERSION}"
          if [ "${{ inputs.profile }}" != "production" ]; then
            TAG_NAME="v${VERSION}-${{ inputs.profile }}"
          fi

          echo "Creating and pushing Git tag: $TAG_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -fa "$TAG_NAME" -m "Release $TAG_NAME (${{ inputs.platform }} - ${{ inputs.profile }})"
          git push origin "$TAG_NAME" --force
